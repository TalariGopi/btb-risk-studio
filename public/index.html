<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Farm-to-fork quantitative microbial risk assessment for Mycobacterium bovis in unpasteurised cheese. Teagasc Moorepark, DAFM PSSRC Topic 8.1.">
<style>:root{color-scheme:light}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>bTB-RISK Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: fixed evidence rail on the left, scrolling work surface on the right;
   collapses to a stacked page with a sticky section bar under 900px. */
:root{
  --ink:#0b1f2e; --ink-2:#1d3a4f; --muted:#5a7183; --faint:#8da2b0;
  --bg:#f5f7f8; --surface:#ffffff; --surface-2:#eef2f4; --line:#d8e0e5;
  --brand:#0e6b63; --brand-2:#17a394; --brand-soft:#e2f1ef;
  --navy:#092334; --navy-2:#0f3550;
  --low:#2f8f6f; --mod:#c98a12; --high:#b4472e;
  --shadow:0 1px 2px rgba(11,31,46,.06),0 8px 24px rgba(11,31,46,.06);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --rail:260px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e8f0f3; --ink-2:#c3d5de; --muted:#90a8b6; --faint:#6b8695;
  --bg:#071722; --surface:#0d2432; --surface-2:#122c3c; --line:#1d3d4f;
  --brand:#3fcab8; --brand-2:#5fe0cf; --brand-soft:#0f3b38;
  --navy:#061420; --navy-2:#0b2a3d;
  --low:#49c396; --mod:#e9b445; --high:#ef7f63;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#e8f0f3; --ink-2:#c3d5de; --muted:#90a8b6; --faint:#6b8695;
  --bg:#071722; --surface:#0d2432; --surface-2:#122c3c; --line:#1d3d4f;
  --brand:#3fcab8; --brand-2:#5fe0cf; --brand-soft:#0f3b38;
  --navy:#061420; --navy-2:#0b2a3d;
  --low:#49c396; --mod:#e9b445; --high:#ef7f63;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
a{color:var(--brand)}
code,.mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#shell{display:flex;min-height:100%}
#rail{width:var(--rail);flex:0 0 var(--rail);background:var(--navy);color:#cfe3ea;
  position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));
  overflow-y:auto;z-index:40;
  padding-block:18px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
#rail .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
#rail .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--brand-2),var(--brand));
  display:grid;place-items:center;color:#042;font-weight:700;font-size:12px;letter-spacing:.02em;flex:0 0 auto}
#rail .brand b{font-family:var(--serif);font-size:17px;color:#fff;display:block;line-height:1.1}
#rail .brand span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7fb3b6}
#rail nav{margin-top:18px;display:flex;flex-direction:column;gap:1px}
#rail .grp{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#5f8899;margin:16px 0 6px 10px}
#rail a.nav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:#bcd6e0;
  text-decoration:none;font-size:13.5px;border-left:2px solid transparent}
#rail a.nav:hover{background:rgba(255,255,255,.06);color:#fff}
#rail a.nav.on{background:rgba(63,202,184,.14);color:#fff;border-left-color:var(--brand-2);font-weight:500}
#rail a.nav .dot{width:5px;height:5px;border-radius:50%;background:#406c7f;flex:0 0 auto}
#rail a.nav.on .dot{background:var(--brand-2)}
#rail .railfoot{margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:#6f93a3;line-height:1.5}
#rail .railfoot img{display:block;height:26px;width:auto;margin:12px 0 0;opacity:.95}

#main{flex:1 1 auto;min-width:0}
.wrap{max-width:1080px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:30px 72px}
#topbar{display:none}
#mobnav{display:none}

@media (max-width:900px){
  #shell{display:block}
  #rail{display:none}
  #topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
    background:var(--navy);color:#fff;
    padding-block:10px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #topbar .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,var(--brand-2),var(--brand));display:grid;place-items:center;color:#042;font-weight:700;font-size:11px}
  #topbar b{font-family:var(--serif);font-size:15px}
  #topbar button{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:7px;padding:7px 11px;font:inherit;font-size:13px}
  #mobnav{display:none;background:var(--navy-2);
    padding-block:8px 14px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #mobnav.open{display:block}
  #mobnav a{display:block;padding:8px 6px;color:#cfe3ea;text-decoration:none;font-size:14px;border-bottom:1px solid rgba(255,255,255,.07)}
  #mobnav a.on{color:var(--brand-2);font-weight:600}
}

/* ---------- common blocks ---------- */
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:600}
.lead{font-size:16px;color:var(--ink-2);max-width:66ch}
.page>h1{font-size:30px;margin:6px 0 8px}
.page>h2{font-size:21px;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.page h3{font-size:16px;margin:20px 0 6px}
p{margin:10px 0;max-width:72ch}
.small{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.tile .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--serif);font-size:25px;font-weight:600;margin-top:3px;letter-spacing:-.02em}
.tile .s{font-size:12px;color:var(--faint);margin-top:2px}
.tile.accent{border-left:3px solid var(--brand)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.low{background:color-mix(in srgb,var(--low) 14%,transparent);color:var(--low);border-color:color-mix(in srgb,var(--low) 35%,transparent)}
.pill.mod{background:color-mix(in srgb,var(--mod) 16%,transparent);color:var(--mod);border-color:color-mix(in srgb,var(--mod) 38%,transparent)}
.pill.high{background:color-mix(in srgb,var(--high) 14%,transparent);color:var(--high);border-color:color-mix(in srgb,var(--high) 35%,transparent)}
.note{border-left:3px solid var(--brand);background:var(--brand-soft);padding:12px 14px;border-radius:0 9px 9px 0;font-size:14px;color:var(--ink-2)}
.warn{border-left:3px solid var(--mod);background:color-mix(in srgb,var(--mod) 10%,transparent);padding:12px 14px;border-radius:0 9px 9px 0;font-size:14px;color:var(--ink-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.eq{font-family:var(--serif);font-size:17px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:14px 16px;margin:12px 0;overflow-x:auto;white-space:nowrap}
.eq em{font-style:italic}
canvas{display:block;width:100%;max-width:100%}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.chartbox h3{margin:0 0 2px;font-size:15px}
.chartbox .cap{font-size:12px;color:var(--muted);margin-bottom:10px}
button.btn{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:9px;padding:10px 18px;
  background:var(--brand);color:#fff;cursor:pointer}
button.btn:hover{background:var(--brand-2)}
button.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
button.btn.ghost:hover{background:var(--surface-2)}
button.btn[disabled]{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}

/* ---------- hero ---------- */
.hero{background:var(--navy);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:1.25fr .85fr;color:#dbeaf0;margin-bottom:8px}
.hero .ht{padding:34px 30px}
.hero h1{color:#fff;font-size:33px;line-height:1.14;margin:8px 0 12px}
.hero p{color:#aec9d5;max-width:46ch;font-size:15px}
.hero .hi{position:relative;min-height:230px;background:#07192a}
.hero .hi img{width:100%;height:100%;object-fit:cover;display:block}
.hero .hi::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--navy) 0%,rgba(9,35,52,.25) 45%,transparent 100%)}
.hero .tagrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.hero .tagrow span{font-size:11.5px;color:#9ec6cf;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px 10px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .hi{min-height:150px;order:-1}.hero .hi::after{background:linear-gradient(0deg,var(--navy) 0%,transparent 65%)}.hero .ht{padding:24px 20px}.hero h1{font-size:26px}}

/* ---------- assessment form ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.steps button{font:inherit;font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);cursor:pointer}
.steps button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.field{display:grid;gap:4px;margin:0 0 13px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--faint)}
.field input,.field select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink);width:100%;min-width:0}
.field .src{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.src.lit{color:var(--brand)} .src.cal{color:var(--mod)} .src.usr{color:var(--muted)}
.runbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow);margin-top:20px;z-index:20}
.runbar .st{font-size:13px;color:var(--muted);min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:8px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.refs{font-size:13px;color:var(--ink-2)}
.refs li{margin:7px 0}
footer.page-foot{border-top:1px solid var(--line);margin-top:40px;padding-top:18px;font-size:12.5px;color:var(--muted)}
.logos{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:14px 0}
.logos img{height:44px;width:auto;opacity:.95}
</style>


</head>
<body>
<div id="shell">
  <aside id="rail">
    <div class="brand">
      <div class="mark">bTB</div>
      <div><b>bTB-RISK Studio</b><span>Teagasc &middot; DAFM PSSRC 8.1</span></div>
    </div>
    <nav id="navlinks"></nav>
    <div class="railfoot">
      Research demonstration. Not a regulatory decision tool.
      <div><img src="assets/teagasc.png" alt="Teagasc"><img src="assets/dafm.png" alt="Department of Agriculture, Food and the Marine"></div>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div class="mark">bTB</div><b>bTB-RISK Studio</b>
      <button id="mobtoggle" aria-expanded="false">Sections</button>
    </div>
    <div id="mobnav"></div>
    <div class="wrap"><div id="view" class="page"></div></div>
  </div>
</div>
<script src="app.js"></script>

</body>
</html>
